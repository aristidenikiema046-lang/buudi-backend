services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: buudi-backend:latest
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    depends_on: []

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro

  queue:
    image: buudi-backend:latest
    restart: unless-stopped
    env_file: .env
    network_mode: host
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - app

  scheduler:
    image: buudi-backend:latest
    restart: unless-stopped
    env_file: .env
    network_mode: host
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - app

volumes:
  storage_data:
  public_data:
